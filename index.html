<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Switchly",
      "url": "https://switchly.fr",
      "logo": "https://switchly.fr/favicon.png",
      "description": "Switchly organise des achats groupés d'énergie et d'internet pour réduire vos factures jusqu'à 30%. Inscription gratuite, sans engagement.",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+33-6-59-78-58-10",
        "contactType": "customer service",
        "email": "contact@switchly.fr",
        "availableLanguage": ["French"],
        "areaServed": "FR"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Avenue de la République",
        "addressLocality": "Paris",
        "postalCode": "75011",
        "addressCountry": "FR"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Switchly - Achat groupé énergie et internet",
      "url": "https://switchly.fr",
      "description": "Rejoignez l'achat groupé Switchly et économisez jusqu'à 400€/an sur vos factures d'électricité et d'internet.",
      "inLanguage": "fr-FR",
      "publisher": {
        "@type": "Organization",
        "name": "Switchly",
        "logo": {
          "@type": "ImageObject",
          "url": "https://switchly.fr/favicon.png"
        }
      }
    }
    </script>
    
    <!-- Structured Data - Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Achat groupé d'énergie et internet",
      "provider": {
        "@type": "Organization",
        "name": "Switchly"
      },
      "description": "Service gratuit d'achat groupé pour négocier des tarifs avantageux d'électricité et d'internet auprès des fournisseurs.",
      "areaServed": "FR",
      "serviceType": "Achat groupé énergie",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Inscription gratuite et sans engagement"
      }
    }
    </script>
    
    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Est-ce vraiment gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, l'inscription à l'achat groupé énergie et internet est totalement gratuite et sans engagement. Vous êtes libre d'accepter ou de refuser l'offre négociée."
          }
        },
        {
          "@type": "Question",
          "name": "Suis-je obligé d'accepter l'offre ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Vous décidez librement d'accepter ou non l'offre négociée. Aucune obligation, aucune pénalité si vous refusez."
          }
        },
        {
          "@type": "Question",
          "name": "Comment Switchly se rémunère ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Certains fournisseurs d'énergie ou d'internet peuvent nous rémunérer si vous acceptez une offre, sans aucun impact sur votre tarif."
          }
        },
        {
          "@type": "Question",
          "name": "Quelles économies puis-je espérer avec l'achat groupé ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Grâce à l'achat groupé d'électricité et d'internet, nos membres peuvent économiser jusqu'à 400€ par an selon leur contrat actuel et leur consommation."
          }
        },
        {
          "@type": "Question",
          "name": "Switchly est-il un comparateur d'énergie ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Switchly organise des achats groupés d'énergie et d'internet pour négocier des tarifs collectifs. Nous ne comparons pas l'ensemble du marché."
          }
        }
      ]
    }
    </script>
    
    <!-- Structured Data - BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Accueil",
          "item": "https://switchly.fr/"
        }
      ]
    }
    </script>

    <meta name="keywords" content="achat groupé énergie, achat groupé électricité, achat groupé internet, réduire facture électricité, économies énergie, fournisseur énergie, achat groupé par ville" />
