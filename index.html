<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Switchly",
      "url": "https://switchly.fr",
      "logo": "https://switchly.fr/favicon.png",
      "description": "Rejoignez notre achat groupé d'énergie et d'internet pour économiser jusqu'à 30% sur vos factures.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+33-6-59-78-58-10",
        "contactType": "customer service",
        "email": "contact@switchly.fr",
        "availableLanguage": "French"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "France",
        "addressCountry": "FR"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Switchly",
      "url": "https://switchly.fr",
      "description": "Achat groupé d'électricité et internet pour économiser jusqu'à 400€/an",
      "inLanguage": "fr-FR",
      "publisher": {
        "@type": "Organization",
        "name": "Switchly"
      }
    }
    </script>
    
    <!-- Structured Data - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Est-ce vraiment gratuit ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, l'inscription est totalement gratuite et sans engagement."
          }
        },
        {
          "@type": "Question",
          "name": "Suis-je obligé d'accepter l'offre ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Vous décidez librement d'accepter ou non l'offre négociée."
          }
        },
        {
          "@type": "Question",
          "name": "Comment Switchly se rémunère ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Certains fournisseurs peuvent nous rémunérer si vous acceptez une offre, sans impact sur votre tarif."
          }
        },
        {
          "@type": "Question",
          "name": "Quelles économies puis-je espérer ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cela dépend de votre contrat actuel, mais l'objectif est de réduire au maximum vos factures d'énergie et d'internet."
          }
        }
      ]
    }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Switchly - Achat groupé électricité et internet | Économisez jusqu'à 400€/an</title>
    <meta name="description" content="Rejoignez le groupement de votre ville et payez moins cher votre électricité et internet grâce à l'achat groupé. Inscription gratuite, sans engagement." />
    <meta name="author" content="Switchly" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4C8BF5" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Switchly - Achat groupé électricité et internet" />
    <meta property="og:description" content="Économisez jusqu'à 400€/an sur vos factures grâce à l'achat groupé local." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://switchly.fr" />
    <meta property="og:image" content="https://switchly.fr/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Switchly" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Switchly" />
    <meta name="twitter:image" content="https://switchly.fr/og-image.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://switchly.fr" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://kaebtbcufbpkhyrhuson.supabase.co" />
    
    <!-- Preload critical fonts with display=swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
